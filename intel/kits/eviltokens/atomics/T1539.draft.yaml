attack_technique: T1539
display_name: "PRT cookie generation via /api/prt/cookie"
_mapping_confidence: medium
_mapping_confidence_rationale: "T1539 (Steal Web Session Cookie) covers PRT-cookie minting -- PRT cookies are the Microsoft session-cookie variant used by the Entra browser-SSO flow. T-ID not stated explicitly in cited Sekoia post."
_citations:
  - claim_type: api_endpoints
    source_url: https://blog.sekoia.io/new-widespread-eviltokens-kit-device-code-phishing-as-a-service-part-1/
    quote_or_anchor: "EvilTokens exposes /api/prt/cookie which takes a refresh token + nonce and returns a usable x-ms-RefreshTokenCredential PRT cookie"
  - claim_type: token_flows
    source_url: https://blog.sekoia.io/new-widespread-eviltokens-kit-device-code-phishing-as-a-service-part-1/
    quote_or_anchor: "Kit uses Microsoft's PRT-cookie minting flow (typically observed via Get-AzureADJoinAuthenticationToken / KDFv2) to convert a refresh token into a browser-injectable cookie"
atomic_tests:
  - name: "EvilTokens variant -- PRT cookie minting"
    auto_generated_guid: "00000000-0000-0000-0000-000000000000"  # regenerate at promotion
    description: |
      Emulates the EvilTokens kit's /api/prt/cookie endpoint. Takes a refresh
      token captured by an upstream atomic (T1078.004) and a nonce fetched
      from login.microsoftonline.com, then mints an x-ms-RefreshTokenCredential
      PRT cookie suitable for injection into a browser session.

      No `expected_telemetry` is asserted at this layer: PRT-cookie minting
      itself is a client-side cryptographic operation and does not produce
      Entra signin events. Telemetry appears when the cookie is *used* --
      that belongs in a downstream atomic.
    supported_platforms: [windows]
    auth_profile: lab-user-mfa
    requires_token:
      from: T1078.004
      resource: https://login.microsoftonline.com
    executor:
      name: powershell
      command: |
        # LAB TENANT ONLY -- Tacklebox.psm1 enforces at load
        # wrap-tool: dependencies/manifests/aadinternals.json (Get-AADIntUserPRTToken / New-AADIntUserPRTToken)
        # OR: dependencies/manifests/roadtx.json (roadtx prt)
        throw "stub -- implement against lab tenant"
    exercises_chokepoint:
      id: CP-TODO-PRT-MINT
      url: https://iimp0ster.github.io/detection-chokepoints/CP-TODO-PRT-MINT
    references:
      - https://blog.sekoia.io/new-widespread-eviltokens-kit-device-code-phishing-as-a-service-part-1/
