# Lens diversity check (required for _mapping_confidence: high on kit_internals + token_flows):
#   kit_internals:  Sekoia (infrastructure) + Microsoft TI (identity_provider) -- PASS
#   token_flows:    Sekoia (infrastructure) + Dirk-Jan Mollema (identity_provider) -- PASS

# Promotion target: consolidate into atomics/T1550.001-token-refresh-swap/T1550.001-token-refresh-swap.yaml
#   Add this entry to atomic_tests[]. Tycoon-specific context: FOCI pivot from OfficeHome
#   to EXO/Outlook is the documented operator pattern.

atomic_tests:
  - name: "Tycoon 2FA variant -- FOCI refresh token pivot to Exchange Online"
    auto_generated_guid: "00000000-0000-0000-0000-000000000000"  # regenerate at promotion
    description: |
      Emulates the Tycoon 2FA operator pattern of pivoting from an initial Graph
      token (obtained via OfficeHome AiTM capture) to Exchange Online / Outlook
      resources using a FOCI-compatible client ID. In the wild, Tycoon operators
      use the captured refresh token without re-authentication to access mailbox
      resources and enumerate mail for BEC targeting.
    supported_platforms: [windows]
    auth_profile: refresh-token-swap
    input_arguments:
      token_input_path:
        description: "Path to roadtools token cache from T1539 (cookie-replay) step."
        type: Path
      target_resource:
        description: "Resource to pivot to (Tycoon targets EXO after initial OfficeHome capture)."
        type: String
        default: "https://outlook.office.com"
      tenant_id:
        description: "Entra tenant ID of the lab tenant."
        type: String
        default: "00000000-0000-0000-0000-000000000000"
      token_output_path:
        description: "Path to write the pivoted token for downstream atomics."
        type: Path
        default: "#{token_cache_path}"
    executor:
      name: powershell
      command: |
        # LAB TENANT ONLY -- Tacklebox.psm1 enforces at load
        # wrap-tool: dependencies/manifests/roadtx.json
        roadtx refreshtokens `
          --tokenfile '#{token_input_path}' `
          --tenant '#{tenant_id}' `
          --resource '#{target_resource}' `
          --outfile '#{token_output_path}'
    cleanup_command: |
      if (Test-Path -LiteralPath '#{token_output_path}') {
          Remove-Item -LiteralPath '#{token_output_path}' -Force
      }
    expected_telemetry:
      - source: entra_signin
        within_minutes: 5
        match:
          authenticationProtocol: "refreshToken"
          ResourceDisplayName: "Office 365 Exchange Online"
    exercises_chokepoint:
      id: aitm-websocket-relay
      url: https://iimp0ster.github.io/detection-chokepoints/drafts/credential-access/aitm-websocket-relay

  # -----------------------------------------------------------------------
  # NEW VARIANT (2026-05-27) — Elastic Security Labs source
  # Device-Code-Grant phishing via MAB app ID — a distinct Tycoon 2FA variant
  # that does NOT require a relay page (no phishing URL to block).
  # The existing entry above covers FOCI refresh token pivot post-relay;
  # this entry covers the alternative device-code initial access path.
  # -----------------------------------------------------------------------
  - name: "Tycoon 2FA variant -- device-code-grant phishing via MAB app ID (Elastic 2026-05-27)"
    auto_generated_guid: "00000000-0000-0000-0000-000000000000"  # regenerate at promotion
    description: |
      Emulates Tycoon 2FA's device-code-grant phishing variant. The kit requests a
      device code using the Microsoft Authentication Broker app ID
      (29d9ed98-a469-4536-ade2-f981bc1d605e), presents it to the victim as a
      "verification code," and polls oauth2/token until the victim redeems it at
      microsoft.com/devicelogin. The resulting Auth Broker refresh token is
      FOCI-compatible, granting access to Exchange, Graph, SharePoint, and Teams.

      Token progression: none → refreshToken → (optional PRT via T1098.005 chain).

      Key telemetry: authenticationProtocol: deviceCode + appId 29d9ed98-... +
      isInteractive: true in Entra ID SigninLogs.

      Lab-safe execution: roadtx or TokenTacticsV2 can drive the device-code flow
      interactively in the lab tenant. The kit's polling loop is replaced by a
      manually completed interactive sign-in.

      Prevention: CA policy "Block device code flow" returns error 53003.
      If deployed in the lab tenant, expect sign-in failure (verify CA policy
      state before running).
    supported_platforms: [windows]
    auth_profile: lab-user-mfa
    input_arguments:
      tenant_id:
        description: "Entra tenant ID of the lab tenant."
        type: String
        default: "00000000-0000-0000-0000-000000000000"
      token_output_path:
        description: "Path to write the Auth Broker refresh token cache."
        type: Path
        default: "#{token_cache_path}"
    executor:
      name: powershell
      command: |
        # LAB TENANT ONLY -- Tacklebox.psm1 enforces at load
        # wrap-tool: dependencies/manifests/tokentacticsv2.json
        # MAB app ID: 29d9ed98-a469-4536-ade2-f981bc1d605e
        # Drives device-code flow to Microsoft Authentication Broker; user must
        # authenticate at microsoft.com/devicelogin to complete the flow.
        throw "stub -- implement with roadtx device --client-id '29d9ed98-a469-4536-ade2-f981bc1d605e' --tenant '#{tenant_id}' against lab tenant"
    cleanup_command: |
      if (Test-Path -LiteralPath '#{token_output_path}') {
          Remove-Item -LiteralPath '#{token_output_path}' -Force
      }
    expected_telemetry:
      - source: entra_signin
        within_minutes: 10
        match:
          AuthenticationProtocol: "deviceCode"
          AppId: "29d9ed98-a469-4536-ade2-f981bc1d605e"
          ResultType: "0"
          IsInteractive: "true"
    exercises_chokepoint:
      id: oauth-device-code-phishing
      url: https://iimp0ster.github.io/detection-chokepoints/drafts/defense-evasion/oauth-device-code-phishing
