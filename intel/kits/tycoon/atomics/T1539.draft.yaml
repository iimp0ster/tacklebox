# Lens diversity check (required for _mapping_confidence: high on kit_internals/aitm_tradecraft):
#   Sekoia (infrastructure) + Microsoft TI (identity_provider) -- PASS

# Promotion target: consolidate into atomics/T1539-cookie-replay/T1539-cookie-replay.yaml
#   Add this entry to atomic_tests[]. The existing entry covers generic cookie replay;
#   this variant adds Tycoon-specific telemetry expectations and UA/ASN context.

atomic_tests:
  - name: "Tycoon 2FA variant -- relay cookie injection via roadtx"
    auto_generated_guid: "00000000-0000-0000-0000-000000000000"  # regenerate at promotion
    description: |
      Lab-safe approximation of Tycoon 2FA's AiTM cookie capture step.
      In the wild, Tycoon relays the victim's session to login.microsoftonline.com
      and intercepts ESTSAUTH/ESTSAUTHPERSISTENT after MFA completion.
      The lab substitute injects a pre-captured lab session cookie via roadtx.
      Key Tycoon fingerprint: OfficeHome appId (4765445b-32c6-49b0-83e6-1d93765276ca),
      datacenter egress (AS9009/AS29802), hardcoded Chrome/Windows UA.
      NOTE: the relay UA-anomaly and ASN tells are ABSENT from this lab stub.
      See observation.md §"Lab-safe primitive vs. observed TTP" for full explanation.
    supported_platforms: [windows]
    auth_profile: cookie-replay
    input_arguments:
      session_cookie:
        description: "Captured ESTSAUTH or ESTSAUTHPERSISTENT cookie value from lab interactive signin."
        type: String
        default: "PLACEHOLDER_STOLEN_COOKIE"
      tenant_id:
        description: "Entra tenant ID of the lab tenant."
        type: String
        default: "00000000-0000-0000-0000-000000000000"
      resource:
        description: "Target resource URI (Tycoon primarily targets OfficeHome then pivots via FOCI)."
        type: String
        default: "https://graph.microsoft.com"
      token_output_path:
        description: "Path to write the resulting token cache file for downstream atomics."
        type: Path
        default: "#{token_cache_path}"
    executor:
      name: powershell
      command: |
        # LAB TENANT ONLY -- Tacklebox.psm1 enforces at load
        # wrap-tool: dependencies/manifests/roadtx.json
        roadtx getcookies `
          --cookie '#{session_cookie}' `
          --tenant '#{tenant_id}' `
          --resource '#{resource}' `
          --tokenfile '#{token_output_path}'
    cleanup_command: |
      if (Test-Path -LiteralPath '#{token_output_path}') {
          Remove-Item -LiteralPath '#{token_output_path}' -Force
      }
    expected_telemetry:
      - source: entra_signin
        within_minutes: 5
        match:
          appId: "4765445b-32c6-49b0-83e6-1d93765276ca"
          authenticationProtocol: "none"
          clientAppUsed: "Browser"
      - source: ual
        within_minutes: 15
        match:
          Operations: "UserLoggedIn"
          AuthenticationType: "Cookie"
    exercises_chokepoint:
      id: aitm-websocket-relay
      url: https://iimp0ster.github.io/detection-chokepoints/drafts/credential-access/aitm-websocket-relay

  # -----------------------------------------------------------------------
  # NEW VARIANT (2026-05-27) — Elastic Security Labs source
  # Distinct from the generic cookie-replay variant above.
  # Models the Tycoon 2FA kit relay SIGN-IN event (the server-to-server HTTP
  # call the kit makes to Microsoft with a Node.js UA) rather than the
  # downstream cookie injection.
  # -----------------------------------------------------------------------
  - name: "Tycoon 2FA variant -- Node.js UA relay sign-in simulation (Elastic 2026-05-27)"
    auto_generated_guid: "00000000-0000-0000-0000-000000000000"  # regenerate at promotion
    description: |
      Simulates the Entra ID sign-in event generated by Tycoon 2FA's kit relay tier
      when it makes server-to-server HTTP calls to Microsoft using Node.js HTTP client
      user agents (axios/1.15.2, undici). In production, the relay forwards credentials
      and relays MFA challenges via Socket.IO using these UAs; no browser UA is present
      on the server-side relay sign-in event.

      Observed apps: OfficeHome (4765445b-32c6-49b0-83e6-1d93765276ca), Microsoft
      Authentication Broker (29d9ed98-a469-4536-ade2-f981bc1d605e), Microsoft Graph,
      Microsoft Exchange Online.

      Lab-safe substitution: roadtx authenticates to the target app with a custom UA
      matching the kit's axios/1.15.2 string. The Socket.IO relay architecture is
      absent; the key telemetry — Node.js UA on a successful M365 app sign-in — is
      reproduced. This variant exercises the UA-based detection in
      drafts/credential-access/aitm-websocket-relay/sigma/{hunt,analyst}.yml.

      Two-tier correlation variant: run this atomic (cloud-VPS egress profile) then
      run T1539-residential-proxy-replay (residential egress) on the same UPN within
      20 minutes to exercise the two-tier ASN analyst rule.
    supported_platforms: [windows]
    auth_profile: lab-user-mfa
    input_arguments:
      tenant_id:
        description: "Entra tenant ID of the lab tenant."
        type: String
        default: "00000000-0000-0000-0000-000000000000"
      target_app_id:
        description: "App ID to sign in to (OfficeHome = 4765445b-32c6-49b0-83e6-1d93765276ca)."
        type: String
        default: "4765445b-32c6-49b0-83e6-1d93765276ca"
      token_output_path:
        description: "Path to write the resulting token cache."
        type: Path
        default: "#{token_cache_path}"
    executor:
      name: powershell
      command: |
        # LAB TENANT ONLY -- Tacklebox.psm1 enforces at load
        # wrap-tool: dependencies/manifests/tokentacticsv2.json
        # Authenticates to OfficeHome with axios/1.15.2 UA to reproduce kit relay telemetry.
        # roadtx --user-agent flag or TokenTacticsV2 custom UA option required.
        throw "stub -- implement with roadtx auth --client-id '#{target_app_id}' --user-agent 'axios/1.15.2' against lab tenant"
    cleanup_command: |
      if (Test-Path -LiteralPath '#{token_output_path}') {
          Remove-Item -LiteralPath '#{token_output_path}' -Force
      }
    expected_telemetry:
      - source: entra_signin
        within_minutes: 5
        match:
          ResultType: "0"
          UserAgent: "axios/1.15.2"
          AppId: "4765445b-32c6-49b0-83e6-1d93765276ca"
      - source: entra_signin
        within_minutes: 5
        match:
          ResultType: "0"
          UserAgent: "undici"
          AppId: "4765445b-32c6-49b0-83e6-1d93765276ca"
    exercises_chokepoint:
      id: aitm-websocket-relay
      url: https://iimp0ster.github.io/detection-chokepoints/drafts/credential-access/aitm-websocket-relay
