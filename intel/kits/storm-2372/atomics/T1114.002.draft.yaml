atomic_tests:
  - name: "Storm-2372 variant -- remote email collection via Graph of keyword-matching messages"
    auto_generated_guid: "00000000-0000-0000-0000-000000000000"  # regenerate at promotion
    description: |
      Emulates Storm-2372 post-auth email exfiltration via Microsoft Graph.
      Actor collects emails identified by prior keyword search (T1087.004 step).
      MS TI verbatim: Email exfiltration via Microsoft Graph of the emails found
      from these searches.
      Requires an access token obtained from T1078.004 (device-code theft step).
      Generates MailItemsAccessed events in UAL (E5 licence required).
    supported_platforms: [windows]
    auth_profile: graph-delegated
    input_arguments:
      token_cache_path:
        description: "Path to the token cache from T1078.004 step."
        type: Path
        default: "tacklebox-storm2372-tokens.json"
      target_user_id:
        description: "UPN or object ID of the compromised mailbox."
        type: String
      message_ids_path:
        description: "Path to JSON file containing message IDs from T1087.004 keyword search."
        type: Path
        default: "tacklebox-storm2372-keyword-hits.json"
      output_path:
        description: "Path to write collected message content."
        type: Path
        default: "tacklebox-storm2372-exfil.json"
    executor:
      name: powershell
      command: |
        # LAB TENANT ONLY -- Tacklebox.psm1 enforces at load
        # wrap-tool: dependencies/manifests/graphrunner.json
        throw "stub -- implement against lab tenant"
    cleanup_command: |
      if (Test-Path -LiteralPath '#{output_path}') {
          Remove-Item -LiteralPath '#{output_path}' -Force
      }
    expected_telemetry:
      - source: ual
        within_minutes: 30
        match:
          Operations: MailItemsAccessed
          ClientInfoString: Graph
