display_name: "Storm-2372 -- Remote Email Collection via Microsoft Graph After Token Capture"
_mapping_confidence: medium
_mapping_confidence_rationale: "MS TI states Email exfiltration via Microsoft Graph of the emails found from these searches but exact Graph endpoint not specified; medium pending endpoint confirmation."
_citations:
