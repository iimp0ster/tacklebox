atomic_tests:
  - name: "Storm-2372 variant -- device-code phishing token capture via TokenTacticsV2"
    auto_generated_guid: "00000000-0000-0000-0000-000000000000"  # regenerate at promotion
    description: |
      Emulates Storm-2372 device-code OAuth flow abuse. The actor generates a device
      code request, embeds the code in a lure (fake Teams meeting invitation), and
      polls the token endpoint until the victim authenticates. On success the actor
      captures access and refresh tokens.
      MS TI verbatim: capture the authentication access and refresh tokens that are
      generated, then use those tokens to access the targets accounts and data.
      Entra errorCode sequence: 50199 (awaiting user) then 0 (success).
      RiskEventType: anonymizedIPAddress, investigationsThreatIntelligence.
    supported_platforms: [windows]
    auth_profile: device-code-polling
    input_arguments:
      tenant_id:
        description: "Entra tenant ID of the lab tenant."
        type: String
        default: "00000000-0000-0000-0000-000000000000"
      client_id:
        description: "OAuth client ID to use for device code request (lab: use a registered lab app)."
        type: String
        default: "00000000-0000-0000-0000-000000000000"
      scope:
        description: "OAuth scope for the device code request."
        type: String
        default: "https://graph.microsoft.com/.default"
      token_output_path:
        description: "Path to write the captured token cache for downstream atomics."
        type: Path
        default: "tacklebox-storm2372-tokens.json"
    executor:
      name: powershell
      command: |
        # LAB TENANT ONLY -- Tacklebox.psm1 enforces at load
        # wrap-tool: dependencies/manifests/tokentacticsv2.json
        throw "stub -- implement against lab tenant"
    cleanup_command: |
      if (Test-Path -LiteralPath '#{token_output_path}') {
          Remove-Item -LiteralPath '#{token_output_path}' -Force
      }
    expected_telemetry:
      - source: entra_signin
        within_minutes: 5
        match:
          authenticationProtocol: deviceCode
          errorCode_sequence: 50199 then 0
      - source: entra_risk
        within_minutes: 30
        match:
          riskEventType: anonymizedIPAddress
