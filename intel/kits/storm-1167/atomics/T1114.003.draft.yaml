# LAB TENANT ONLY -- Tacklebox.psm1 enforces at load
attack_technique: T1114.003
display_name: "Inbox forwarding rule for persistence/exfil after Storm-1167 capture"
_mapping_confidence: medium
_mapping_confidence_rationale: "T1114.003 (Email Collection: Email Forwarding Rule) is the established mapping for inbox-forwarding-rule persistence in BEC playbooks. Storm-1167-driven BEC follows the standard inbox-rule pattern; not explicitly mapped in cited Sekoia 2025-06 report."
_citations:
  - claim_type: aitm_tradecraft
    source_url: https://blog.sekoia.io/global-analysis-of-adversary-in-the-middle-phishing-threats/
    quote_or_anchor: "Sekoia 2025-06, BEC section (p10): 'They may also create email forwarding rules that automatically redirect incoming messages to an attacker controlled email address, enabling continued information gathering even after the victim resets their account.'"
  - claim_type: entra_telemetry
    source_url: https://learn.microsoft.com/en-us/purview/audit-log-activities
    quote_or_anchor: "Exchange Online inbox-rule operations are logged in the Unified Audit Log as Operation=New-InboxRule with RecordType=ExchangeAdmin"
atomic_tests:
  - name: "Storm-1167 variant -- create inbox forwarding rule via Graph"
    auto_generated_guid: "00000000-0000-0000-0000-000000000000"  # regenerate at promotion
    description: |
      Emulates the persistence step commonly observed after a
      Storm-1167 / FlowerStorm relay capture: a forwarding inbox rule
      is created on the victim mailbox to silently exfiltrate selected
      messages to an operator-controlled address. Uses the token
      acquired in T1550.001 (refresh-token pivot to Exchange
      resource).
    supported_platforms: [windows]
    auth_profile: lab-user-mfa
    requires_token:
      from: T1550.001
      resource: https://outlook.office.com
    input_arguments:
      forward_target:
        description: "Lab-controlled forwarding destination."
        type: String
        default: "lab-exfil@tacklebox.local"
      rule_name:
        description: "Inbox rule display name."
        type: String
        default: "FlowerStorm-Lab-Exfil-Rule"
    executor:
      name: powershell
      command: |
        # LAB TENANT ONLY -- Tacklebox.psm1 enforces at load
        # wrap-tool: dependencies/manifests/microsoft.graph.json (New-MgUserMailFolderMessageRule)
        # OR: dependencies/manifests/exchangeonlinemanagement.json (New-InboxRule)
        throw "stub -- implement against lab tenant"
    expected_telemetry:
      - source: exo_audit
        within_minutes: 30
        match:
          Operation: "New-InboxRule"
          RecordType: "<UNKNOWN -- verify against MS docs (ExchangeAdmin or numeric code)>"
    exercises_chokepoint:
      id: CP-TODO-INBOX-RULE
      url: https://iimp0ster.github.io/detection-chokepoints/CP-TODO-INBOX-RULE
    references:
      - https://blog.sekoia.io/global-analysis-of-adversary-in-the-middle-phishing-threats/
      - https://learn.microsoft.com/en-us/purview/audit-log-activities
