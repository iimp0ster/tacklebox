attack_technique: T1539
display_name: "AiTM session cookie capture via synchronous-relay PhaaS (Storm-1167/FlowerStorm)"
_mapping_confidence: medium
_mapping_confidence_rationale: "T1539 (Steal Web Session Cookie) is the consensus mapping for AiTM session-cookie capture across Sekoia, Microsoft TI, and Push Security. Storm-1167's synchronous-relay mechanism captures the Microsoft-issued session cookie; not explicitly mapped to a T-ID in the cited Sekoia 2025-06 report."
_citations:
  - claim_type: kit_internals
    source_url: https://blog.sekoia.io/global-analysis-of-adversary-in-the-middle-phishing-threats/
    quote_or_anchor: "Storm-1167 kit sheet: 'JavaScript code implementing authentication steps -- FQDN from Tencent cloud platform -- Obfuscated JavaScript -- JavaScript code implementing all the variations in a Microsoft 365 authentication, and rendering fake Microsoft pages'"
  - claim_type: aitm_tradecraft
    source_url: https://blog.sekoia.io/global-analysis-of-adversary-in-the-middle-phishing-threats/
    quote_or_anchor: "Storm-1167 kit sheet: 'PhaaS' / 'Synchronous relay' / aliased FlowerStorm. Sekoia assesses the PhaaS has several hundred active affiliates."
  - claim_type: entra_telemetry
    source_url: https://learn.microsoft.com/en-us/entra/identity/monitoring-health/concept-sign-in-log-activity-details
    quote_or_anchor: "Entra sign-in logs expose appId, ResourceDisplayName, AuthenticationProtocol, and userAgent fields; the OfficeHome appId value (4765445b-32c6-49b0-83e6-1d93765276ca) is documented in well-known Microsoft Entra application reference material."
atomic_tests:
  - name: "Storm-1167 variant -- session cookie capture via interactive lab signin (relay-substitute primitive)"
    auto_generated_guid: "00000000-0000-0000-0000-000000000000"  # regenerate at promotion
    description: |
      Emulates Storm-1167 / FlowerStorm's synchronous-relay session
      cookie capture step. Tacklebox does not stand up a relay; the
      lab-safe substitute is an authenticated signin from a
      Tacklebox-controlled client targeting the OfficeHome app, with
      the resulting Microsoft session cookie persisted to disk for
      downstream replay. Produces an Entra sign-in record consistent
      with App ID 4765445b-32c6-49b0-83e6-1d93765276ca but lacks the
      AS132203 (Tencent) / AS19871 (Network Solutions) source-ASN
      signal that distinguishes real FlowerStorm signins.
    supported_platforms: [windows]
    auth_profile: lab-user-mfa
    executor:
      name: powershell
      command: |
        # LAB TENANT ONLY -- Tacklebox.psm1 enforces at load
        # wrap-tool: dependencies/manifests/aadinternals.json (Get-AADIntAccessTokenForAADGraph + cookie persistence)
        # OR: dependencies/manifests/roadtx.json (roadtx auth + tokenfile)
        throw "stub -- implement against lab tenant"
    expected_telemetry:
      - source: entra_signin
        within_minutes: 5
        match:
          appId: "4765445b-32c6-49b0-83e6-1d93765276ca"  # OfficeHome (Sekoia 2025-06, Storm-1167 kit sheet)
          AuthenticationProtocol: "<UNKNOWN -- verify against MS docs>"
          UserAuthenticationMethod: "<UNKNOWN -- verify against MS docs>"
    exercises_chokepoint:
      id: CP-TODO-AITM-CAPTURE
      url: https://iimp0ster.github.io/detection-chokepoints/CP-TODO-AITM-CAPTURE
    references:
      - https://blog.sekoia.io/global-analysis-of-adversary-in-the-middle-phishing-threats/
      - https://www.microsoft.com/en-us/security/blog/2023/06/08/detecting-and-mitigating-a-multi-stage-aitm-phishing-and-bec-campaign/
      - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/concept-sign-in-log-activity-details
