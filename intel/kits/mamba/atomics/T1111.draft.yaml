attack_technique: T1111
display_name: "MFA relay interception -- Mamba 2FA OTP and push-notification relay"
_mapping_confidence: high
_mapping_confidence_rationale: "T1111 (Multi-Factor Authentication Interception) directly describes the behavior: Mamba's relay intercepts OTP codes and authenticator push notifications from the victim in real-time and replays them to Microsoft's auth endpoint. Sekoia tier_1 source explicitly states 'handles two-step verifications for non-phishing-resistant MFA methods such as one-time codes and app notifications' and documents the otp_command Socket.IO event with phish_otp parameter."
_citations:
  - claim_type: kit_internals
    source_url: https://blog.sekoia.io/mamba-2fa-a-new-contender-in-the-aitm-phishing-ecosystem/
    quote_or_anchor: "otp_command Socket.IO event with phish_otp parameter; phish_state values RQ_OTP_NOPASS_APP, RQ_OTP_APP, RQ_OTP_APP_CODE, RQ_OTP_PHONE"
  - claim_type: aitm_tradecraft
    source_url: https://blog.sekoia.io/mamba-2fa-a-new-contender-in-the-aitm-phishing-ecosystem/
    quote_or_anchor: "handles two-step verifications for non-phishing-resistant MFA methods such as one-time codes and app notifications"

