atomic_tests:
  - name: "Mamba 2FA -- real-time OTP / authenticator-push relay interception"
    auto_generated_guid: "00000000-0000-0000-0000-000000000000"  # regenerate at promotion
    description: |
      Emulates the MFA relay step of the Mamba 2FA AiTM kit.
      Mamba's Socket.IO relay intercepts MFA challenges from the victim in real time:
        - OTP codes: victim enters code on phishing page -> otp_command event ->
          relay submits phish_otp to Microsoft before the code expires.
        - Authenticator push: relay triggers Microsoft push -> victim approves on
          real device -> relay captures approval and continues auth flow.
      phish_state values RQ_OTP_APP, RQ_OTP_APP_CODE, RQ_OTP_PHONE, RQ_OTP_NOPASS_APP
      signal which MFA method is active.

      This technique targets non-phishing-resistant MFA only (TOTP, SMS, push).
      FIDO2/passkeys and certificate-based auth are not interceptable by this method.

      Lab substitute: NONE currently defined.
      Tacklebox has no mechanism to relay a live MFA challenge from a victim device.
      A future fixture could use a lab tenant with a known TOTP seed to inject a
      valid code at the relay step, but this is not yet implemented.

      This stub documents the behavior and telemetry expectation so detection
      engineering can validate the sign-in log shape without full relay emulation.
    supported_platforms: [windows]
    auth_profile: lab-user-mfa
    executor:
      name: powershell
      command: |
        # LAB TENANT ONLY -- Tacklebox.psm1 enforces at load
        # wrap-tool: TBD -- no wrap-tool currently supports relay-based MFA interception.
        # TODO: design fixture using known TOTP seed in lab tenant.
        throw "stub -- MFA relay interception requires relay fixture; see observation.md open questions"
    expected_telemetry:
      - source: entra_signin
        within_minutes: 5
        match:
          # MFA completes successfully in the sign-in log because the relay
          # forwards a valid OTP/push approval. Detection signal is NOT an MFA
          # failure but rather the combination of: relay-origin IP, hardcoded UA,
          # and a successful MFA completion that the legitimate user did not initiate.
          authenticationRequirement: "<UNKNOWN -- verify against MS docs>"
          authenticationDetails: "<UNKNOWN -- verify against MS docs>"
          # Expected: mfaType reflects the intercepted method (e.g. oneTimePassword,
          # microsoftAuthenticatorPasswordless) -- exact field name per MS Learn.
          mfaDetail: "<UNKNOWN -- verify against MS docs>"
    exercises_chokepoint:
      id: CP-TODO
      url: https://iimp0ster.github.io/detection-chokepoints/CP-TODO
