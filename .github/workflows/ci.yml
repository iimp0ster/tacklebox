name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned PowerShell modules (Pester, PSScriptAnalyzer, powershell-yaml)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Install-Module -Name Pester           -RequiredVersion 5.6.1  -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.22.0 -Scope CurrentUser -Force
          Install-Module -Name powershell-yaml  -RequiredVersion 0.4.7  -Scope CurrentUser -Force

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings PSGallery -ExcludeRule PSAvoidUsingWriteHost
          $errors = $results | Where-Object Severity -eq 'Error'
          $results | Format-Table -AutoSize
          if ($errors.Count -gt 0) {
            throw "PSScriptAnalyzer found $($errors.Count) error(s)."
          }

      - name: Pester unit tests
        shell: pwsh
        run: |
          $config = & ./tests/pester.config.ps1
          Invoke-Pester -Configuration $config

      - name: Module load smoke-test
        shell: pwsh
        env:
          TACKLEBOX_LAB_OVERRIDE: '1'
        run: |
          Import-Module ./Tacklebox.psd1 -Force
          $null = Get-Tackle
          $null = Get-TackleboxRig
          Write-Host "Module loaded; Get-Tackle and Get-TackleboxRig returned cleanly."
