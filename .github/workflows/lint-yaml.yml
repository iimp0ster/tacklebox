name: lint-yaml

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (for ajv-cli)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ajv-cli
        run: |
          npm install --global ajv-cli ajv-formats
          npm install js-yaml

      - name: Validate atomics against schema
        run: |
          shopt -s nullglob
          fail=0
          for yaml in atomics/*/*.yaml; do
            json="$(node -e "console.log(JSON.stringify(require('js-yaml').load(require('fs').readFileSync('$yaml','utf8'))))")"
            echo "$json" > /tmp/atomic.json
            if ! ajv validate -s schema/tacklebox-atomic.schema.json -d /tmp/atomic.json --strict=false -c ajv-formats --spec=draft2020; then
              echo "::error file=$yaml::Schema validation failed"
              fail=1
            fi
          done
          # Phase 0: atomics/ is empty by design; loop body never runs.
          # Job still passes — the job exists so the wiring is exercised.
          exit $fail

      - name: Validate rigs against schema
        run: |
          shopt -s nullglob
          fail=0
          for yaml in rigs/*.yaml; do
            json="$(node -e "console.log(JSON.stringify(require('js-yaml').load(require('fs').readFileSync('$yaml','utf8'))))")"
            echo "$json" > /tmp/rig.json
            if ! ajv validate -s schema/tacklebox-rig.schema.json -d /tmp/rig.json --strict=false -c ajv-formats --spec=draft2020; then
              echo "::error file=$yaml::Schema validation failed"
              fail=1
            fi
          done
          exit $fail
