name: deploy-github-pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/github-pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      NEXT_PUBLIC_SITE_BASE_PATH: /tacklebox

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:pages

      - name: Verify GitHub Pages artifact
        shell: bash
        run: |
          test -f dist/client/tacklebox/index.html
          test -f dist/client/tacklebox/infrastructure/tycoon-2fa/index.html
          test -f dist/client/tacklebox/infrastructure/sneaky-2fa/index.html
          test -f dist/client/tacklebox/.nojekyll

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist/client/tacklebox

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
