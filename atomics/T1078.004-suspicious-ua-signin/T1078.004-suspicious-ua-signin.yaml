attack_technique: T1078.004
display_name: "Defense Evasion – Suspicious User-Agent Sign-In"
atomic_tests:
  - name: "Token acquisition with anomalous User-Agent via roadtx"
    auto_generated_guid: b8c9d0e1-f2a3-4567-bcde-567890123407
    description: |
      Authenticates with a User-Agent string that does not match the victim's
      typical browser/client fingerprint. AiTM kits often replay session
      cookies using the kit's own UA, creating a detectable anomaly in
      Entra sign-in logs. Wraps roadtx with a custom --user-agent flag.
    supported_platforms:
      - windows
      - linux
      - macos
    input_arguments:
      tenant_id:
        description: "Entra tenant ID of the lab tenant."
        type: String
        default: "00000000-0000-0000-0000-000000000000"
      client_id:
        description: "OAuth client ID."
        type: String
        default: "04b07795-8ddb-461a-bbee-02f9e1bf7b46"
      resource:
        description: "Target resource URI."
        type: String
        default: "https://graph.microsoft.com"
      user_agent:
        description: "Anomalous User-Agent string to present during authentication."
        type: String
        default: "python-requests/2.31.0"
      token_output_path:
        description: "Path to write the resulting token cache file."
        type: Path
        default: "#{token_cache_path}"
    executor:
      name: powershell
      command: |
        roadtx gettokens `
          --device-code `
          --client '#{client_id}' `
          --resource '#{resource}' `
          --tenant '#{tenant_id}' `
          --user-agent '#{user_agent}' `
          --tokenfile '#{token_output_path}'
    cleanup_command: |
      if (Test-Path -LiteralPath '#{token_output_path}') {
          Remove-Item -LiteralPath '#{token_output_path}' -Force
      }
    references:
      - "https://techcommunity.microsoft.com/t5/microsoft-entra/aitm-phishing-playbook/ba-p/3761965"
    auth_profile: "suspicious-ua"
    defense_evasion: "Non-browser UA fingerprint during token acquisition; detectable in sign-in logs"
    requires_token: false
    expected_telemetry:
      - source: entra_signin
        match:
          authenticationProtocol: "deviceCode"
          clientAppUsed: "Other clients"
        within_minutes: 10
    exercises_chokepoint:
      id: "DC-EVAS-004"
      url: "https://detectionchokepoints.com/evasion/suspicious-ua"
